<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>9ak22 THCS Mỹ Lộc</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="shortcut icon" href="favicon.jpg">
  <link rel="apple-touch-icon" href="favicon.jpg">

  <link rel="stylesheet" href="style.css">
</head>
<body class="relative flex items-center justify-center w-full h-full bg-black">

  <audio id="bgAudio" src="nhac.mp3" autoplay loop preload="auto"></audio>

  <div id="reelViewport" class="w-full overflow-x-hidden no-scrollbar cursor-grab active:cursor-grabbing select-none flex items-center py-4">
    <div id="reelTrack" class="flex items-center gap-5 md:gap-8 w-max will-change-transform"></div>
  </div>

  <div class="stealth-control fixed bottom-6 left-6 z-40 flex items-center space-x-2 bg-neutral-900/80 border border-neutral-800 rounded-full px-3 py-2 shadow-2xl">
    <button id="btnToggleAudio" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white text-xs transition" title="Bật / Dừng nhạc local">
      <i id="audioIcon" class="fa-solid fa-play ml-0.5"></i>
    </button>
    
    <div id="soundWaves" class="flex items-end space-x-0.5 h-4 px-1 opacity-40">
      <div class="w-1 bg-white rounded-full h-2"></div>
      <div class="w-1 bg-white rounded-full h-3"></div>
      <div class="w-1 bg-white rounded-full h-1"></div>
    </div>

    <span id="currentSongLabel" class="text-[10px] text-neutral-400 font-mono pr-1 max-w-[90px] sm:max-w-[120px] truncate">nhac.mp3</span>
  </div>

  <div class="stealth-control fixed bottom-6 right-6 z-40 flex items-center space-x-2 bg-neutral-900/80 border border-neutral-800 rounded-full px-3 py-2 shadow-2xl">
    <button id="btnOpenSettings" class="text-neutral-300 hover:text-white text-xs flex items-center space-x-1.5 px-1 py-0.5" title="Thêm Media & Cài đặt">
      <i class="fa-solid fa-gear text-sm"></i>
      <span class="text-[11px] font-medium hidden sm:inline">Quản lý</span>
    </button>
  </div>

  <div id="rotatePromptModal" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 transition-all duration-300 opacity-0 pointer-events-none">
    <div class="bg-neutral-900/90 border border-neutral-700/60 rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center mb-4 text-white text-xl rotate-phone-anim">
        <i class="fa-solid fa-mobile-screen-button"></i>
      </div>
      <h3 class="text-sm font-semibold text-white tracking-wide mb-1.5">Trải nghiệm Điện ảnh</h3>
      <p class="text-xs text-neutral-400 mb-5 leading-relaxed">
        Xoay ngang màn hình và bật toàn màn hình để ngắm trọn vẹn dải phim.
      </p>
      <button id="btnEnterLandscapeFullscreen" class="w-full py-2.5 bg-white text-black font-semibold rounded-xl text-xs active:scale-95 transition mb-2 shadow-lg flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-expand text-[11px]"></i>
        <span>Toàn màn hình & Xoay ngang</span>
      </button>
      <button id="btnDismissRotatePrompt" class="text-neutral-500 hover:text-neutral-300 text-[11px] py-1 transition">
        Tiếp tục xem dọc
      </button>
    </div>
  </div>

  <div id="fullscreenModal" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4 hidden transition-opacity duration-200 opacity-0 cursor-zoom-out">
    <button id="btnCloseFullscreen" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-neutral-900/80 text-white flex items-center justify-center border border-neutral-800 active:scale-95 transition">
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>
    <div id="fullscreenContent" class="max-w-4xl max-h-[85vh] w-full flex items-center justify-center overflow-hidden rounded-[24px]"></div>
  </div>

  <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-semibold tracking-wide text-neutral-200">Quản lý Dải Phim</h3>
        <button id="btnCloseSettings" class="text-neutral-500 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="flex border-b border-neutral-800 mb-4 text-xs font-medium">
        <button id="tabUploadBtn" class="flex-1 py-2 border-b-2 border-white text-white">Upload Cloudinary</button>
        <button id="tabUrlBtn" class="flex-1 py-2 text-neutral-500 hover:text-neutral-300">Dán Link Media</button>
      </div>

      <div id="sectionUpload" class="space-y-4 text-xs">
        <label class="border border-dashed border-neutral-700 hover:border-neutral-500 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-black/40">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-neutral-400 mb-2"></i>
          <span class="text-neutral-300">Chọn video hoặc ảnh từ máy</span>
          <input type="file" id="fileMediaUpload" accept="image/*,video/*" multiple class="hidden">
        </label>
        
        <div id="chosenFileName" class="text-neutral-400 text-xs truncate hidden bg-neutral-950 p-2 rounded-lg border border-neutral-800"></div>

        <div id="uploadProgressWrapper" class="space-y-1.5 hidden">
          <div class="flex justify-between text-[11px] text-neutral-400">
            <span id="uploadStatusText">Đang tải lên...</span>
            <span id="uploadPercentText">0%</span>
          </div>
          <div class="w-full bg-neutral-950 rounded-full h-1.5 overflow-hidden border border-neutral-800">
            <div id="uploadProgressFill" class="bg-white h-full transition-all duration-200" style="width: 0%"></div>
          </div>
        </div>

        <button id="btnExecuteUpload" class="w-full py-2.5 bg-white text-black font-semibold rounded-xl active:scale-95 transition">Bắt đầu Upload</button>
      </div>

      <div id="sectionUrl" class="space-y-3 text-xs hidden">
        <div>
          <label class="text-neutral-400 block mb-1">Đường dẫn ảnh/video Cloudinary:</label>
          <input type="url" id="inputDirectUrl" placeholder="https://res.cloudinary.com/.../video.mp4" class="w-full bg-black border border-neutral-800 rounded-xl p-2.5 text-white outline-none focus:border-neutral-600">
        </div>
        <div class="flex items-center space-x-4 py-1">
          <label class="flex items-center text-neutral-300 cursor-pointer">
            <input type="radio" name="mediaType" value="video" checked class="mr-1.5 accent-white"> Video
          </label>
          <label class="flex items-center text-neutral-300 cursor-pointer">
            <input type="radio" name="mediaType" value="image" class="mr-1.5 accent-white"> Hình ảnh
          </label>
        </div>
        <div class="flex items-center space-x-4 py-1 border-t border-neutral-800/60 pt-2">
          <span class="text-neutral-400 text-[11px]">Tỉ lệ:</span>
          <label class="flex items-center text-neutral-300 cursor-pointer">
            <input type="radio" name="mediaOrientation" value="landscape" checked class="mr-1.5 accent-white"> Ngang (16:9)
          </label>
          <label class="flex items-center text-neutral-300 cursor-pointer">
            <input type="radio" name="mediaOrientation" value="portrait" class="mr-1.5 accent-white"> Dọc (9:16)
          </label>
        </div>
        <button id="btnAddDirectUrl" class="w-full py-2.5 bg-white text-black font-semibold rounded-xl active:scale-95 transition">Thêm vào dải phim</button>
      </div>

      <div class="mt-6 pt-4 border-t border-neutral-800">
        <div class="flex items-center justify-between mb-2">
          <h4 class="text-xs font-medium text-neutral-400">Các khung hình hiện tại:</h4>
          <button id="btnCleanDuplicates" class="text-[10px] text-amber-400 hover:text-amber-300 font-mono hidden flex items-center gap-1">
            <i class="fa-solid fa-broom"></i> Xóa trùng lặp
          </button>
        </div>
        <div id="mediaManagerList" class="space-y-1.5 max-h-48 overflow-y-auto no-scrollbar"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
